services:
  order-api:
    depends_on:
      - sqlserver
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8081
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=OrderDb;User Id=sa;Password=DatabasePassword@123;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Redis__EnableCaching=true
      - UserService__BaseUrl=http://user-api:8080  # Add this line
    volumes:
      - ./OrderService/logs:/app/logs
    
  user-api:
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=UserDb;User Id=sa;Password=DatabasePassword@123;TrustServerCertificate=True
    volumes:
      - ./UserService/logs:/app/logs
      
  notification-api:
    depends_on:
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8082
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    volumes:
      - ./NotificationService/logs:/app/logs

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=DatabasePassword@123
    ports:
      - "14331:1433"
    volumes:
      - sqlvolume:/var/opt/mssql

  rabbitmq:
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq  # Standardized to match main file

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  apigateway:
    depends_on:  # Added to ensure proper startup order
      - user-api
      - order-api
      - notification-api
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # If enabling HTTPS in dev, uncomment and adjust below:
      # - ASPNETCORE_URLS=http://+:8080;https://+:8081
      # - ASPNETCORE_HTTP_PORTS=8080
      # - ASPNETCORE_HTTPS_PORTS=8081
    # If enabling HTTPS, uncomment ports and volumes below:
    # ports:
    #   - "8088:8080"  # Host HTTP (adjust if needed)
    #   - "8089:8081"  # Host HTTPS (adjust if needed)
    # volumes:
    #   - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
    #   - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
    #   - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    #   - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

volumes:
  sqlvolume:
  rabbitmq_data:  # Standardized name
  redis_data: